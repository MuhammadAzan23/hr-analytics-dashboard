# Pings the Render backend every 10 minutes so the free instance doesn't sleep.
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables).
name: keep-api-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 "${{ vars.API_URL }}/api/health" || echo "ping failed"
